version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: pwa_web
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pwa_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web